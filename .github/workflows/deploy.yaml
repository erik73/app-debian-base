---
name: Deploy

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

jobs:
  ci:
    uses: erik73/workflows/.github/workflows/base-ci.yaml@b825c628ef43b63d29c5884084db701d973a1879 # v2.0.3

  deploy:
    needs: ci
    uses: erik73/workflows/.github/workflows/base-deploy.yaml@b825c628ef43b63d29c5884084db701d973a1879 # v2.0.3
